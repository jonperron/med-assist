name: Backend Tests

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "latest"

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: uv sync --all-extras
      working-directory: ./backend

    - name: Run tests
      run: uv run pytest
      working-directory: ./backend
