name: Docker build

permissions:
  contents: read
  packages: write

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to build and push
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to build and push (e.g. 0.6.2)
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG_NAME }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG_NAME }}

      # WARNING - READ BEFORE POINTING THIS AT backend/Dockerfile.
      #
      # ghcr.io/${{ github.repository }} is a package pushed from CI with
      # GITHUB_TOKEN, which links it to this repository, and this repository is
      # public. Since the model became a build stage, a backend image built from
      # backend/Dockerfile contains the NER weights - DrBERT fine-tuned on a
      # clinical corpus that is not distributable. Pushing one here publishes
      # them, irreversibly.
      #
      # Today this step fails instead: context is the repository root and there
      # is no Dockerfile there. That is a bug, not a safeguard, and the obvious
      # repair - adding `file: backend/Dockerfile` - is the incident. Before
      # this workflow builds a backend image, ghcr.io/jonperron/med-assist has
      # to be private, and that needs a decision entry of its own.
      #
      # See scripts/build_model_image.sh and
      # openwiki/decisions/2026-08-31-the-weights-ship-as-their-own-private-image.md
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
