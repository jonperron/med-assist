name: Docker build

permissions:
  contents: read
  packages: write

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to build and push
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to build and push (e.g. 0.6.2)
        required: true
        type: string
  # Nothing built this image outside a release, so the first run that ever
  # exercised it was the one publishing 0.1.0 - and it failed, as did 1.0.0.
  # A release is the worst place to discover that the build is broken, so the
  # inputs to the image are built on every pull request that touches them.
  # Same job, without the push.
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - '.dockerignore'
      # The dependency sets and the two per-service Dockerfiles this one
      # mirrors. Application code is not listed: backend-ci and frontend-ci
      # already run the test suite and `next build` on every change to it,
      # and this build takes minutes.
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'backend/Dockerfile'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/next.config.ts'
      - 'frontend/Dockerfile'
      - '.github/workflows/docker_build.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      # Empty on a pull request, which is what every `if` below keys on: no
      # registry login, no tags, no push - just the build.
      TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}

    steps:
      # An empty ref checks out the ref that triggered the run, which is what a
      # pull request wants.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      # The docker-container driver, which the layer cache below needs: the
      # default driver cannot export one.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.TAG_NAME != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        if: env.TAG_NAME != ''
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG_NAME }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG_NAME }}

      # The context is the repository root because the image is built from both
      # halves of it: the Dockerfile there builds the interface and the API into
      # one container. backend/Dockerfile and frontend/Dockerfile are what
      # `docker compose up` builds, and are not what a release publishes. See
      # openwiki/decisions/2026-09-05-the-release-image-is-one-container.md.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ env.TAG_NAME != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The torch CPU wheels are most of this image and change rarely.
          # Without a cache every pull-request build downloads them again.
          cache-from: type=gha
          cache-to: type=gha,mode=max
