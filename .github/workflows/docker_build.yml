name: Docker build

permissions:
  contents: read
  packages: write

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag_name:
        description: Release tag to build and push
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to build and push (e.g. 0.6.2)
        required: true
        type: string
  # Nothing built this image outside a release, so the first run that ever
  # exercised it was the one publishing 0.1.0 - and it failed, as did 1.0.0.
  # A release is the worst place to discover that the build is broken, so the
  # inputs to the image are built on every pull request that touches them.
  # Same job, without the push.
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - '.dockerignore'
      # The dependency sets and the two per-service Dockerfiles this one
      # mirrors. Application code is not listed: backend-ci and frontend-ci
      # already run the test suite and `next build` on every change to it,
      # and this build takes minutes.
      - 'backend/pyproject.toml'
      - 'backend/uv.lock'
      - 'backend/Dockerfile'
      # COPYed by name because pyproject.toml declares it as the project
      # readme: the dependency install fails without it, and no other CI job
      # would notice it going away.
      - 'backend/README.md'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/next.config.ts'
      - 'frontend/Dockerfile'
      # Not part of the standalone output and placed by hand, so `next build`
      # succeeds without it and only this build fails.
      - 'frontend/public/**'
      - '.github/workflows/docker_build.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      # Empty on a pull request, which is what every `if` below keys on: no
      # registry login, no tags, no push - just the build.
      TAG_NAME: ${{ inputs.tag_name || github.event.release.tag_name }}

    steps:
      # An empty ref checks out the ref that triggered the run, which is what a
      # pull request wants.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      # The docker-container driver, which the layer cache below needs: the
      # default driver cannot export one.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.TAG_NAME != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        if: env.TAG_NAME != ''
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG_NAME }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG_NAME }}

      # The context is the repository root because the image is built from both
      # halves of it: the Dockerfile there builds the interface and the API into
      # one container. backend/Dockerfile and frontend/Dockerfile are what
      # `docker compose up` builds, and are not what a release publishes. See
      # openwiki/decisions/2026-09-05-the-release-image-is-one-container.md.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ env.TAG_NAME != '' }}
          # A pull request has nothing to push to, so the image goes into the
          # runner's daemon instead and the step below starts it. The two are
          # mutually exclusive, which is why both are keyed on the same thing.
          load: ${{ env.TAG_NAME == '' }}
          tags: ${{ steps.meta.outputs.tags || 'med-assist:pr' }}
          labels: ${{ steps.meta.outputs.labels }}
          # The torch CPU wheels are most of this image and change rarely.
          # Without a cache every pull-request build downloads them again.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A build that succeeds still ships a container that cannot start: a Node
      # binary whose base moved out from under it, an entrypoint that exits, a
      # standalone server that cannot find the static files copied in beside
      # it. None of that is visible to `docker build`, so the pull request runs
      # the image rather than only building it - which is the whole point of
      # building on pull requests at all.
      #
      # Without weights, deliberately: they are not in the image and not on the
      # runner. What this asserts is the shape a container without them must
      # have - both processes up, readiness honest about the model it has not
      # got - plus the one thing an operator notices first if it regresses,
      # that the container stops when it is asked to.
      - name: Run the image
        if: env.TAG_NAME == ''
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8000:8000 -p 3000:3000 med-assist:pr
          trap 'docker logs smoke || true; docker rm -f smoke >/dev/null || true' EXIT

          # Both ports, not just the API: the two processes start
          # independently and nothing orders them, so waiting on one and then
          # asserting the other is a race that passes on whichever runner
          # happened to be fast. `|| true` because the wait is not the
          # assertion - the assertions below are, and they report which half
          # never came up.
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 \
              && curl -fsS http://127.0.0.1:3000/ >/dev/null 2>&1 \
              && break
            sleep 2 || true
          done

          # The API answers, so uvicorn started under the entrypoint.
          curl -fsS http://127.0.0.1:8000/healthz

          # The interface answers, so `node` started and the standalone server
          # resolved the static files placed next to it.
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 200

          # Readiness reports the model that is not there rather than the port
          # that is open.
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/readyz)" = 503

          # 128 + SIGTERM, and well inside the ten seconds before SIGKILL.
          docker stop --timeout 10 smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' smoke)" = 143
