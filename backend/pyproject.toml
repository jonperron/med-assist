[project]
name = "med-assist-backend"
version = "0.1.0"
description = "The backend for the Med-Assist application."
authors = [{ name = "Jonathan Perron", email = "jonathan@perron.bzh" }]
requires-python = ">=3.12, <3.15"
readme = "README.md"
license = {text = "Apache-2.0"}
dependencies = [
    "anyio>=4.14.2,<5",
    "fastapi[standard]==0.135.1",
    "uvicorn[standard]==0.42.0",
    "PyMuPDF==1.27.2",
    "python-docx==1.2.0",
    "redis==7.3.0",
    "pydantic-settings>=2.13.1,<3",
    "transformers>=5.3.0,<6",
    "torch>=2.10.0,<3",
    "protobuf>=7.34.1,<8",
    "sentencepiece>=0.2.1,<0.3",
    "numpy>=2.4.3,<3",
    "urllib3>=2.6.3,<3",
    "python-multipart>=0.0.26,<0.1",
    "cryptography>=50.0.0,<51",
]

# Inference runs on the CPU, always. The default PyPI `torch` resolves to the
# CUDA build on Linux and drags the whole `nvidia-*` wheel set into the runtime
# image - gigabytes of GPU runtime for a service that never touches a GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pre-commit>=4.5.1",
    "ruff>=0.15.7",
    "mypy>=1.19.1",
    "pylint>=4.0.5",
    "virtualenv>=21.2.0",
]

# The model training project lives in backend/training/ with its own
# environment. Without this, a local `pytest` walks into its tests and fails on
# imports that only exist there.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["app"]

[tool.hatch.build.targets.wheel]
include = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
