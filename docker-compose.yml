services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8000"
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    volumes:
      - ${MODEL_DIR:-./backend/models}:/app/models:ro
    deploy:
      resources:
        limits:
          memory: ${BACKEND_MEMORY_LIMIT:-2g}
          cpus: "${BACKEND_CPU_LIMIT:-2}"
    restart: unless-stopped
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PYTHONUNBUFFERED=1
      - TMPDIR=/tmp
      - NER_MODEL_NAME=/app/models/
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_DISABLE_TELEMETRY=1
      - NER_INFERENCE_THREADS=${NER_INFERENCE_THREADS:-${BACKEND_CPU_LIMIT:-2}}
      - NER_MAX_CONCURRENT_INFERENCES=${NER_MAX_CONCURRENT_INFERENCES:-1}
      - APP_ENV=${APP_ENV:-production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys;
          sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status == 200 else 1)"
          2>/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    container_name: med_assist_backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000" # Exposes Next.js standalone server on host port 3000
    environment:
      - UNSECURED_DEPLOYMENT=${UNSECURED_DEPLOYMENT:-}
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY_LIMIT:-512m}
          cpus: "${FRONTEND_CPU_LIMIT:-1}"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    container_name: med_assist_frontend
