services:
  # One service, not two: the root Dockerfile builds the interface and the API
  # into a single image and starts both under docker-entrypoint.sh, so this is
  # what a working copy runs and what a tagged release ships as the same
  # image. See
  # openwiki/decisions/2026-09-08-compose-builds-the-unified-image.md.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 8050, not the Dockerfile's own 8000 default: this build arg is
        # resolved by the *browser*, which reaches the API at the host port
        # this file publishes it on below, not at the container-internal
        # port. See
        # openwiki/decisions/2026-09-08-the-backends-published-port-moved-to-8050.md
        # for why that host port is 8050, and why the root Dockerfile's own
        # ARG default is deliberately left at 8000 for the standalone
        # release-image case, which publishes 8000 directly.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8050}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:8050:8000"
      # Deliberately not loopback-gated the way 8050 is above: the interface
      # authenticates nobody either way, and the analysis it drives already
      # goes through the API's own CORS/origin check - see deploy/README.md.
      - "3050:3000" # Exposes Next.js standalone server on host port 3050
    # 256m, paired with MAX_BATCH_FILES's 50MB-per-file ceiling and uvicorn's
    # --limit-concurrency 8 in docker-entrypoint.sh: at most 8 uploaded parts
    # can be spooling here at once, and this has to hold all of them. Raise
    # concurrency or the per-file ceiling without raising this and clinical
    # documents start spilling onto the container's writable layer instead.
    tmpfs:
      - /tmp:size=256m,mode=1777,noexec,nosuid,nodev
    volumes:
      - ${MODEL_DIR:-./backend/models}:/app/models:ro
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-2.5g}
          cpus: "${APP_CPU_LIMIT:-3}"
    restart: unless-stopped
    # A parser crash on attacker-supplied input is the threat these two guard
    # against beyond what the image's own non-root user already does: no
    # capability this process doesn't need, and no route to regain one via a
    # setuid binary in the base image.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Belt and suspenders with docker-entrypoint.sh's own `ulimit -c 0`: that
    # one is what protects a container started outside Compose (`docker run`,
    # a platform that ignores this file), this one needs no image cooperation
    # at all. Either alone is enough; both cost nothing to keep.
    ulimits:
      core: 0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PYTHONUNBUFFERED=1
      - TMPDIR=/tmp
      - NER_MODEL_NAME=/app/models/
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_DISABLE_TELEMETRY=1
      - NER_INFERENCE_THREADS=${NER_INFERENCE_THREADS:-${APP_CPU_LIMIT:-3}}
      - NER_MAX_CONCURRENT_INFERENCES=${NER_MAX_CONCURRENT_INFERENCES:-1}
      - APP_ENV=${APP_ENV:-production}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3050}
      - UNSECURED_DEPLOYMENT=${UNSECURED_DEPLOYMENT:-}
    # No explicit healthcheck: block. The image already declares one covering
    # both ports (readyz on 8000, the interface's root on 3000) and Compose
    # honours an image's own HEALTHCHECK when a service does not override it.
    #
    # No container_name, unlike the two services this replaced: a fixed name
    # is one more thing that would collide under multiple instances, and
    # `docker compose ps`/`logs app` address it by service name regardless.
    # This alone does not make `--scale app=<n>` usable, though: both ports
    # above are fixed host-port publishes, so a second replica still fails to
    # bind them. Scaling this service needs those ports moved onto a proxy or
    # load balancer in front - out of scope here.
