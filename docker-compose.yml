version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: med_assist_redis
    # No host port mapping: Redis is reachable only from the compose network.
    # No RDB snapshot and no AOF: extracted clinical text never reaches the disk.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env - see .env.example}
    environment:
      # Read by redis-cli so the healthcheck authenticates without exposing the
      # password in the process list.
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # Multipart parts above 1MB are spooled to a file under TMPDIR before any
    # route code runs. A RAM-backed /tmp keeps uploaded documents off the
    # container's writable layer, including on the stateless analysis path.
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      - PYTHONUNBUFFERED=1
      - TMPDIR=/tmp
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - NER_MODEL_NAME=/app/models/
      # The model is mounted locally. These make that structural: a misconfigured
      # NER_MODEL_NAME fails instead of quietly reaching out to the Hub.
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_DISABLE_TELEMETRY=1
      # Inference is CPU-only. These bound what one container spends on it.
      - NER_INFERENCE_THREADS=${NER_INFERENCE_THREADS:-0}
      - NER_MAX_CONCURRENT_INFERENCES=${NER_MAX_CONCURRENT_INFERENCES:-1}
      - RETENTION_TTL_SECONDS=${RETENTION_TTL_SECONDS:-3600}
      - STORAGE_ENCRYPTION_KEY=${STORAGE_ENCRYPTION_KEY:-}
      - STORE_DOCUMENT_TEXT=${STORE_DOCUMENT_TEXT:-false}
      - PSEUDONYMIZE_ENTITIES=${PSEUDONYMIZE_ENTITIES:-true}
      # Development mode mounts the mock endpoints; production is the default.
      - APP_ENV=${APP_ENV:-production}
    container_name: med_assist_backend
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time, so it must be the URL the
        # browser uses to reach the backend - not the compose service name.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000" # Exposes Next.js standalone server on host port 3000
    depends_on:
      - backend
    container_name: med_assist_frontend
